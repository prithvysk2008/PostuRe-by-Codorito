<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>PostuRe ambient glow</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }
  #glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    transition: box-shadow .7s ease;
  }
</style>
</head>
<body>
  <div id="glow"></div>
  <script>
    // Same intensity/color formula as the app's former in-window ambient
    // glow — this overlay replaced it as the single source of the effect
    // so it reads identically whether PostuRe is focused or not.
    const INTENSITY = { GOOD: 0.12, WATCH: 0.80, BAD: 1.45 }
    const COLOR = { GOOD: '53,230,166', WATCH: '255,138,61', BAD: '255,71,87' }
    const el = document.getElementById('glow')

    function render(status, enabled) {
      const intensity = enabled ? (INTENSITY[status] ?? 0) : 0
      if (intensity <= 0.01) {
        el.style.boxShadow = 'none'
        return
      }
      const rgb = COLOR[status] || '79,216,196'
      const blur = Math.round(70 + 70 * intensity)
      const spread = Math.round(6 + 16 * intensity)
      const alpha = (0.10 + 0.26 * intensity).toFixed(3)
      el.style.boxShadow = `inset 0 0 ${blur}px ${spread}px rgba(${rgb},${alpha})`
    }

    if (window.overlayBridge) {
      window.overlayBridge.onAmbientStatus((payload) => render(payload && payload.status, payload && payload.enabled))
    }
  </script>
</body>
</html>
